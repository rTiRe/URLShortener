services:
  authentik_postgresql:
    container_name: authentik_postgresql
    env_file:
    - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
    - authentik_database:/var/lib/postgresql/data
    networks:
    - authentik
    ports:
      - 5432:5432

  authentik_redis:
    container_name: authentik_redis
    command: --save 60 1 --loglevel warning
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - redis-cli ping | grep PONG
      timeout: 3s
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    volumes:
    - authentik_redis:/data
    networks:
    - authentik

  authentik_server:
    container_name: authentik_server
    command: server
    depends_on:
      authentik_postgresql:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_HOST: "authentik_server:9000,127.0.0.1:9000"
      AUTHENTIK_POSTGRESQL__HOST: authentik_postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.8.1}
    ports:
    - ${COMPOSE_PORT_HTTP:-9000}:9000
    - ${COMPOSE_PORT_HTTPS:-9443}:9443
    restart: unless-stopped
    volumes:
    - ./media:/media
    - ./custom-templates:/templates
    networks:
    - authentik
    - proxy

  authentik_worker:
    container_name: authentik_worker
    command: worker
    depends_on:
      authentik_postgresql:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik_postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_REDIS__HOST: authentik_redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.8.1}
    restart: unless-stopped
    user: root
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./media:/media
    - ./certs:/certs
    - ./custom-templates:/templates
    networks:
    - authentik
    - proxy

  database:
    container_name: database
    image: postgres:17.4-alpine3.21
    restart: unless-stopped
    ports:
      - 127.0.0.1:5440:5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${DB_NAME}", "-U", "${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - database_network
      - migrations_network

  migrations:
    image: migrate/migrate:v4.15.1
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    networks:
      - migrations_network
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER}:${DB_PASS}@database:5432/${DB_NAME}?sslmode=disable",
      "up"
    ]

  api:
    container_name: api
    build:
      context: ./app
    volumes:
      - ./app:/app
      # - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      authentik_server:
        condition: service_healthy
      authentik_worker:
        condition: service_healthy
    # ports:
    #   - 4000:3000
    networks:
      - authentik
      - api_network
      - database_network
      - proxy
    environment:
      - SLOT=1

  nginx:
    image: nginx:mainline-alpine3.21
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx:/etc/nginx/
    depends_on:
      api:
        condition: service_started
      authentik_server:
        condition: service_healthy
      authentik_worker:
        condition: service_healthy
    networks:
      - proxy


volumes:
  database-data:
  authentik_database:
    driver: local
  authentik_redis:
    driver: local


networks:
  migrations_network:
    driver: bridge
  database_network:
    driver: bridge
  api_network:
    driver: bridge
  authentik:
    driver: bridge
  proxy:
    driver: bridge